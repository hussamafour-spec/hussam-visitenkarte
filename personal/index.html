<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hussam Afour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#07060f;
    --bg-1:#120a24;
    --violet:#8b5cf6;
    --pink:#ec4899;
    --cyan:#22d3ee;
    --card:rgba(255,255,255,0.055);
    --card-border:rgba(255,255,255,0.1);
    --text:#f4f1fb;
    --text-dim:#a79cc4;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:var(--bg-0);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    color:var(--text);
    overflow-x:hidden;
    position:relative;
  }

  /* ===== animated aurora backdrop ===== */
  .aurora{ position:fixed; inset:0; overflow:hidden; z-index:0; }
  .aurora span{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:.55;
    mix-blend-mode:screen;
  }
  .aurora span:nth-child(1){
    width:480px;height:480px; left:-120px; top:-140px;
    background:radial-gradient(circle, var(--violet), transparent 70%);
    animation:float1 16s ease-in-out infinite;
  }
  .aurora span:nth-child(2){
    width:420px;height:420px; right:-140px; top:10%;
    background:radial-gradient(circle, var(--cyan), transparent 70%);
    animation:float2 19s ease-in-out infinite;
  }
  .aurora span:nth-child(3){
    width:460px;height:460px; left:10%; bottom:-180px;
    background:radial-gradient(circle, var(--pink), transparent 70%);
    animation:float3 21s ease-in-out infinite;
  }
  @keyframes float1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(60px,40px) scale(1.15); }
  }
  @keyframes float2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-50px,60px) scale(1.1); }
  }
  @keyframes float3{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(40px,-50px) scale(1.2); }
  }

  /* subtle floating sparkles */
  .particle{
    position:fixed; z-index:0; border-radius:50%;
    background:rgba(255,255,255,0.65);
    pointer-events:none;
    animation:sparkle 7s linear infinite;
  }
  @keyframes sparkle{
    0%{ transform:translateY(0) scale(1); opacity:0; }
    10%{ opacity:.9; }
    90%{ opacity:.5; }
    100%{ transform:translateY(-120px) scale(.4); opacity:0; }
  }

  .stage{ position:relative; z-index:1; width:100%; max-width:380px; }

  .card-wrap{
    position:relative;
    border-radius:30px;
    padding:2px;
    background:conic-gradient(from 0deg, var(--violet), var(--pink), var(--cyan), var(--violet));
    background-size:200% 200%;
    animation:spin-border 7s linear infinite, rise .7s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 30px 80px rgba(80,40,140,0.35);
  }
  @keyframes spin-border{
    0%{ filter:hue-rotate(0deg); }
    100%{ filter:hue-rotate(360deg); }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(20px) scale(.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .card{
    background:linear-gradient(180deg, rgba(20,14,38,0.92), rgba(12,8,24,0.96));
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-radius:28px;
    padding:40px 26px 26px;
    position:relative;
    overflow:hidden;
    will-change:transform;
    transition:transform .15s ease-out;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(500px 220px at 50% -10%, rgba(139,92,246,0.25), transparent 60%);
    pointer-events:none;
  }

  .portrait-frame{
    display:flex; justify-content:center; margin-bottom:18px; position:relative;
    perspective:1200px;
  }
  .halo{
    position:absolute;
    width:176px;height:176px;
    border-radius:50%;
    background:conic-gradient(var(--violet), var(--pink), var(--cyan), var(--violet));
    animation:halo-spin 6s linear infinite;
    filter:blur(1px);
  }
  @keyframes halo-spin{ to{ transform:rotate(360deg); } }
  .flipper{
    position:relative;
    width:150px;height:150px;
    cursor:pointer;
    transition:transform .8s cubic-bezier(.4,.1,.2,1);
    transform-style:preserve-3d;
    z-index:1;
  }
  .flipper.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 0 4px var(--bg-1), 0 10px 30px rgba(0,0,0,0.6);
  }
  .front-face{ inset:0; }
  .front-face img{ width:100%;height:100%;object-fit:cover; display:block; }
  .back-face{
    width:150px;height:150px; left:0;top:0;
    transform:rotateY(180deg);
  }
  .back-face img{ width:100%;height:100%;object-fit:cover; display:block; }

  .flip-hint{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    opacity:.85;
    margin-bottom:16px;
    letter-spacing:.3px;
    animation:fadeUp .6s ease both; animation-delay:.15s;
  }

  h1{
    text-align:center;
    font-family:'Space Grotesk', 'Manrope', sans-serif;
    font-size:25px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:.2px;
    background:linear-gradient(90deg, #fff 0%, var(--pink) 25%, var(--cyan) 50%, #fff 75%);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shimmer 6s linear infinite, fadeUp .6s ease both;
    animation-delay:0s, .2s;
  }
  @keyframes shimmer{
    0%{ background-position:0% 50%; }
    100%{ background-position:300% 50%; }
  }
  .tagline{
    text-align:center;
    font-size:12px;
    color:var(--cyan);
    font-weight:700;
    letter-spacing:1.6px;
    text-transform:uppercase;
    margin-bottom:22px;
    animation:fadeUp .6s ease both; animation-delay:.25s;
  }

  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(236,72,153,0.4), rgba(34,211,238,0.4), transparent);
    margin:0 0 18px;
  }

  .rows{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .row{
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:12px 14px;
    text-decoration:none;
    color:var(--text);
    transition:transform .15s ease, background .15s ease, box-shadow .2s ease;
    opacity:0;
    animation:fadeUp .55s ease forwards;
  }
  .row:nth-of-type(1){ animation-delay:.3s; }
  .row:nth-of-type(2){ animation-delay:.38s; }
  .row:nth-of-type(3){ animation-delay:.46s; }
  .row:active{ transform:scale(.97); background:rgba(255,255,255,0.08); }
  @media (hover:hover){
    .row:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(139,92,246,0.25); border-color:rgba(236,72,153,0.3); }
  }
  .icon{
    width:36px;height:36px;flex-shrink:0;
    border-radius:50%;
    background:linear-gradient(135deg, rgba(139,92,246,0.35), rgba(34,211,238,0.25));
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .icon svg{ width:17px;height:17px; fill:none; stroke:currentColor; }
  .row-text{ display:flex; flex-direction:column; gap:1px; min-width:0; flex:1; }
  .row-label{ font-size:10.5px; color:var(--text-dim); }
  .row-value{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .actions{ display:flex; flex-direction:column; gap:10px; }
  .btn{
    position:relative;
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px;
    border-radius:16px;
    font-size:14.5px;
    font-weight:700;
    text-decoration:none;
    letter-spacing:.2px;
    overflow:hidden;
    transition:transform .12s ease, filter .15s ease;
    opacity:0;
    animation:fadeUp .55s ease forwards;
  }
  .btn:nth-of-type(1){ animation-delay:.54s; }
  .btn:nth-of-type(2){ animation-delay:.62s; }
  .btn:active{ transform:scale(.97); }
  .btn svg{ width:16px;height:16px; fill:none; stroke:currentColor; position:relative; z-index:1; }
  .btn span{ position:relative; z-index:1; }
  .btn-primary{
    background:linear-gradient(120deg, var(--violet) 0%, var(--pink) 50%, var(--cyan) 100%);
    background-size:220% 220%;
    color:#0a0514;
    animation:fadeUp .55s ease forwards, gradient-move 5s ease-in-out infinite;
    animation-delay:.54s, 0s;
  }
  .btn-primary::after{
    content:"";
    position:absolute; top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-20deg);
    animation:shine 3.2s ease-in-out infinite;
  }
  @keyframes shine{
    0%{ left:-60%; }
    50%{ left:130%; }
    100%{ left:130%; }
  }
  @keyframes gradient-move{
    0%,100%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
  }
  .btn-secondary{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(34,211,238,0.4);
    color:var(--cyan);
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  footer{
    text-align:center;
    margin-top:22px;
    font-size:10.5px;
    color:var(--text-dim);
    opacity:.6;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

  <div class="aurora"><span></span><span></span><span></span></div>

  <div class="stage">
    <div class="card-wrap" id="cardWrap">
      <div class="card" id="card">

        <div class="portrait-frame">
          <div class="halo"></div>
          <div class="flipper" id="flipper">
            <div class="face front-face">
              <img src="portrait-circle.png" alt="Hussam Afour">
            </div>
            <div class="face back-face">
              <img src="qr-panel-teal.png" alt="QR-Code">
            </div>
          </div>
        </div>
        <div class="flip-hint" id="flipHint">Antippen zum Scannen &amp; Teilen</div>

        <h1>Hussam Afour</h1>
        <div class="tagline">Kontakt</div>

        <div class="divider"></div>

        <div class="rows">
          <a class="row" href="tel:+4915759407677">
            <div class="icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
            <div class="row-text"><div class="row-label">Mobil</div><div class="row-value">0157 5940 7677</div></div>
          </a>
          <a class="row" href="mailto:hussam.afour@gmail.com">
            <div class="icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></div>
            <div class="row-text"><div class="row-label">E-Mail</div><div class="row-value">hussam.afour@gmail.com</div></div>
          </a>
          <a class="row" href="https://www.linkedin.com/in/hussam-afour-5669b4244" target="_blank" rel="noopener">
            <div class="icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg></div>
            <div class="row-text"><div class="row-label">LinkedIn</div><div class="row-value">hussam-afour</div></div>

        </div>

        <div class="actions">
          <a class="btn btn-primary" id="saveBtn" href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0D%0AVERSION%3A3.0%0D%0AN%3AAfour%3BHussam%3B%3B%3B%0D%0AFN%3AHussam%20Afour%0D%0ATEL%3BTYPE%3DCELL%3A%2B4915759407677%0D%0AEMAIL%3BTYPE%3DHOME%3Ahussam.afour%40gmail.com%0D%0AURL%3Ahttps%3A%2F%2Fwww.linkedin.com%2Fin%2Fhussam-afour-5669b4244%0D%0AEND%3AVCARD%0D%0A">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>In Kontakte speichern</span>
          </a>
          <a class="btn btn-secondary" href="mailto:hussam.afour@gmail.com">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
            <span>E-Mail schreiben</span>
          </a>
        </div>

        <footer>Persönliche Visitenkarte · Hussam Afour</footer>
      </div>
    </div>
  </div>

<script>
(function(){
  var flipper = document.getElementById("flipper");
  var hint = document.getElementById("flipHint");
  if(flipper){
    flipper.addEventListener("click", function(e){
      e.stopPropagation();
      var flipped = flipper.classList.toggle("flipped");
      hint.textContent = flipped ? "Antippen zum Zurückdrehen" : "Antippen zum Scannen & Teilen";
    });
  }

  // gentle 3D tilt on pointer move (desktop) — purely cosmetic, safe fallback if unsupported
  var card = document.getElementById("card");
  var wrap = document.getElementById("cardWrap");
  if(card && window.matchMedia("(hover:hover)").matches){
    wrap.addEventListener("mousemove", function(e){
      var r = wrap.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - 0.5;
      var py = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = "rotateX(" + (py * -6) + "deg) rotateY(" + (px * 8) + "deg)";
    });
    wrap.addEventListener("mouseleave", function(){
      card.style.transform = "rotateX(0deg) rotateY(0deg)";
    });
  }

  // floating sparkle particles
  var body = document.body;
  var colors = ["rgba(236,72,153,0.8)","rgba(34,211,238,0.8)","rgba(139,92,246,0.8)","rgba(255,255,255,0.7)"];
  for(var i=0;i<18;i++){
    var p = document.createElement("div");
    p.className = "particle";
    var size = 2 + Math.random()*3;
    p.style.width = size+"px";
    p.style.height = size+"px";
    p.style.left = Math.random()*100 + "vw";
    p.style.top = (40 + Math.random()*60) + "vh";
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (5 + Math.random()*6) + "s";
    p.style.animationDelay = (Math.random()*7) + "s";
    body.appendChild(p);
  }
})();
</script>

</body>
</html>
