<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hussam Afour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0b141c;
    --bg-2:#0f2027;
    --card:#111c24;
    --card-border:rgba(255,255,255,0.08);
    --glass:rgba(255,255,255,0.045);
    --accent:#2dd6c0;
    --accent-dim:#1a8f82;
    --text:#eaf3f1;
    --text-dim:#8fa6a3;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 600px at 50% -10%, #163138 0%, var(--bg-1) 55%),
      linear-gradient(160deg, var(--bg-2) 0%, var(--bg-1) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    color:var(--text);
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--glass);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--card-border);
    border-radius:28px;
    padding:38px 26px 26px;
    position:relative;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(45,214,192,0.04) inset,
      0 30px 70px rgba(0,0,0,0.55);
    animation:rise .7s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(16px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .glow-blob{
    position:absolute; top:-80px; left:50%; transform:translateX(-50%);
    width:260px; height:260px;
    background:radial-gradient(circle, rgba(45,214,192,0.25) 0%, transparent 70%);
    filter:blur(10px);
    pointer-events:none;
    animation:drift 8s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform:translateX(-50%) translateY(0); opacity:.8; }
    50%{ transform:translateX(-50%) translateY(14px); opacity:1; }
  }

  .portrait-frame{
    display:flex; justify-content:center; margin-bottom:18px; position:relative;
    perspective:1200px;
  }
  .flipper{
    position:relative;
    width:150px;height:150px;
    cursor:pointer;
    transition:transform .8s cubic-bezier(.4,.1,.2,1);
    transform-style:preserve-3d;
  }
  .flipper.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .front-face{
    inset:0;
    border-radius:50%;
    overflow:hidden;
    box-shadow:
      0 0 0 3px var(--bg-1),
      0 0 0 5px var(--accent),
      0 10px 30px rgba(0,0,0,0.55);
    animation:breathe 5s ease-in-out infinite;
  }
  .front-face img{ width:100%;height:100%;object-fit:cover; display:block; }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 3px var(--bg-1), 0 0 0 5px var(--accent), 0 0 12px rgba(45,214,192,0.25), 0 10px 30px rgba(0,0,0,0.55); }
    50%{ box-shadow:0 0 0 3px var(--bg-1), 0 0 0 5px var(--accent), 0 0 26px rgba(45,214,192,0.55), 0 10px 30px rgba(0,0,0,0.55); }
  }
  .back-face{
    width:150px;height:150px;
    left:0;top:0;
    transform:rotateY(180deg);
    border-radius:50%;
    overflow:hidden;
    box-shadow:
      0 0 0 3px var(--bg-1),
      0 0 0 5px var(--accent),
      0 10px 30px rgba(0,0,0,0.55);
  }
  .back-face img{ width:100%;height:100%;object-fit:cover; display:block; }

  .flip-hint{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    opacity:.8;
    margin-bottom:16px;
    letter-spacing:.2px;
  }

  h1{
    text-align:center;
    font-size:23px;
    font-weight:800;
    margin:0 0 4px;
    letter-spacing:.2px;
    color:var(--text);
  }
  .tagline{
    text-align:center;
    font-size:12.5px;
    color:var(--accent);
    font-weight:600;
    letter-spacing:.6px;
    text-transform:uppercase;
    margin-bottom:22px;
  }

  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(45,214,192,0.3), transparent);
    margin:0 0 18px;
  }

  .rows{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .row{
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:14px;
    padding:12px 14px;
    text-decoration:none;
    color:var(--text);
    transition:background .15s ease, transform .1s ease;
  }
  .row:active{ transform:scale(.98); background:rgba(255,255,255,0.07); }
  .icon{
    width:34px;height:34px;flex-shrink:0;
    border-radius:50%;
    background:rgba(45,214,192,0.12);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
  }
  .icon svg{ width:17px;height:17px; fill:none; stroke:currentColor; }
  .row-text{ display:flex; flex-direction:column; gap:1px; min-width:0; flex:1; }
  .row-label{ font-size:10.5px; color:var(--text-dim); }
  .row-value{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .actions{ display:flex; flex-direction:column; gap:10px; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px;
    border-radius:14px;
    font-size:14.5px;
    font-weight:700;
    text-decoration:none;
    letter-spacing:.2px;
    transition:transform .1s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn svg{ width:16px;height:16px; fill:none; stroke:currentColor; }
  .btn-primary{
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
    color:#06211d;
  }
  .btn-secondary{
    background:transparent;
    border:1px solid rgba(45,214,192,0.4);
    color:var(--accent);
  }

  footer{
    text-align:center;
    margin-top:22px;
    font-size:10.5px;
    color:var(--text-dim);
    opacity:.6;
  }
</style>
</head>
<body>

  <div class="card">

        <div class="face front-face">

    <h1>Hussam Afour</h1>

      <a class="row" href="https://www.linkedin.com/in/hussam-afour-5669b4244" target="_blank" rel="noopener">

    <footer>Persönliche Visitenkarte · Hussam Afour</footer>
  </div>

<script>
(function(){
  var flipper = document.getElementById("flipper");
  var hint = document.getElementById("flipHint");
  if(!flipper) return;
  flipper.addEventListener("click", function(){
    var flipped = flipper.classList.toggle("flipped");
    hint.textContent = flipped ? "Antippen zum Zurückdrehen" : "Antippen zum Scannen & Teilen";
  });
})();
</script>

</body>
</html>
